---
name: Bump activemq versions

on:
  pull_request:
    paths:
      - .github/workflows/bumpVersions.yml
      - versions/*.json
      - .github/actions/**
      - updatecli.d/**
  workflow_dispatch:
  schedule:
    - cron:  '0 6 * * MON'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  versions:
    name: Read activemq versions
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      activemq_majors: ${{ steps.read.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: read
        uses: ./.github/actions/list-activemq-versions

  updatecli:
    name: Activemq ${{ matrix.activemq_major }} version bump
    runs-on: ubuntu-latest
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        activemq_major: ${{ fromJSON(needs.versions.outputs.activemq_majors) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Updatecli
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-updatecli@v18.21.0

      - name: Updatecli scm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/updatecli
          key: updatecli-v1-${{ hashFiles('updatecli.d/**') }}
          restore-keys: |
            updatecli-v1-

      - name: Set required environment variables
        run: |
          echo "ACTIVEMQ_MAJOR=${{ matrix.activemq_major }}" >> $GITHUB_ENV

      - name: Save current version
        id: current
        run: |
          echo "activemq=$(jq -r '.activemq_version' versions/activemq-${{ matrix.activemq_major }}.json)" >> $GITHUB_OUTPUT

      - name: Run updatecli
        run: |
          updatecli apply

      - name: Save updated version
        id: updated
        run: |
          echo "activemq=$(jq -r '.activemq_version' versions/activemq-${{ matrix.activemq_major }}.json)" >> $GITHUB_OUTPUT

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: github.event_name != 'pull_request'
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          permission-members: read
          permission-pull-requests: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: github.event_name != 'pull_request'
        with:
          branch: bump-activemq-${{ matrix.activemq_major }}
          base: ${{ github.event.repository.default_branch }}
          title: Bump activemq to ${{ steps.updated.outputs.activemq }}
          body: "Freshly served thanks to updatecli and GitHub Actions"
          token: ${{ steps.app-token.outputs.token }}
          team-reviewers: ops-readiness-performance
          labels: updatecli
